<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Squircle Background with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#93c5fd" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Modern Stylized "P" & "A" Linked Emblem with Connectivity Nodes -->
  <g filter="url(#glow)">
    <!-- Interlocking Link Chain / Node Architecture -->
    <!-- Left Loop (P) -->
    <path
      d="M19 44V20H29C33.418 20 37 23.582 37 28C37 32.418 33.418 36 29 36H19"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Right Link Element / Connected Arrow (A & Link) -->
    <path
      d="M33 44L41 26L49 44"
      stroke="url(#accentGrad)"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M36 38H46"
      stroke="url(#accentGrad)"
      stroke-width="3.5"
      stroke-linecap="round"
    />

    <!-- Glowing Node in top right (Active Signal) -->
    <circle cx="49" cy="18" r="3.5" fill="#38bdf8" />
  </g>
</svg>
