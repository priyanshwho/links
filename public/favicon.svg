<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="linkGradient" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Premium Deep Slate Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#1e293b" stroke-width="1.5" />

  <!-- Iconic Glowing Interlocking Link -->
  <g transform="translate(32, 32) rotate(-45) scale(2.1) translate(-12, -12)" 
     stroke="url(#linkGradient)" 
     stroke-width="2.4" 
     stroke-linecap="round" 
     stroke-linejoin="round" 
     filter="url(#glow)">
    <path d="M15 7h3a5 5 0 0 1 5 5 5 5 0 0 1-5 5h-3m-6 0H6a5 5 0 0 1-5-5 5 5 0 0 1 5-5h3" />
    <line x1="8" y1="12" x2="16" y2="12" stroke="#ffffff" stroke-width="2.6" />
  </g>
</svg>
